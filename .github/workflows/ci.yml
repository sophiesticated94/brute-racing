name: Build and race
on: [push, pull_request]
jobs:
  game:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.400
      - name: Install Godot .NET and desktop export templates
        shell: pwsh
        run: ./scripts/setup.ps1 -ExportTemplates
      - name: Domain and protocol tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Network combat under 100 ms RTT and 3 percent unreliable packet loss
        shell: pwsh
        run: ./scripts/integration.ps1 -Impaired -Combat
      - name: Dedicated server and rematch
        shell: pwsh
        run: ./scripts/integration.ps1 -Dedicated -Rounds 2 -Port 29848
      - name: Connection loss and AI takeover
        shell: pwsh
        run: ./scripts/connection-tests.ps1 -SkipBuild
      - name: Eight advanced builds, drift boost and EMP
        shell: pwsh
        run: ./scripts/mechanics-smoke.ps1 -SkipBuild
      - name: Authoritative three-race campaign and persistent rewards
        shell: pwsh
        run: ./scripts/integration.ps1 -Campaign -Impaired -Combat -SkipBuild -Port 29860
      - name: Quick matchmaking including unreachable host recovery
        shell: pwsh
        run: ./scripts/quick-integration.ps1 -UnreachableHost -SkipBuild
      - name: Eight peers and rematch
        shell: pwsh
        run: ./scripts/integration.ps1 -Clients 7 -Rounds 2 -SkipBuild -Port 29865
      - name: Export Windows and Linux
        shell: pwsh
        run: ./scripts/export.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-car-mayhem
          path: |
            artifacts/windows/
            artifacts/linux/
            artifacts/tests/
  linux-smoke:
    needs: game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mini-car-mayhem
          path: build
      - name: Run exported Linux game
        run: |
          chmod +x build/linux/MiniCarMayhem.x86_64
          build/linux/MiniCarMayhem.x86_64 --headless --fixed-fps 60 -- --smoke --bots=7 --results="$PWD/linux-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-report
          path: linux-report.json
  directory-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run directory container
        run: |
          docker build -f src/Game.DirectoryApi/Dockerfile -t brute-racing-directory .
          docker run -d --name directory -p 5080:8080 brute-racing-directory
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:5080/health; then exit 0; fi
            sleep 1
          done
          docker logs directory
          exit 1
